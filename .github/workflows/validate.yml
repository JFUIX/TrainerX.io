name: TrainerX validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure ephemeral secrets
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start application
        run: docker compose up --build -d
      - name: Smoke test
        run: |
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            sleep 2
          done
          node --test tests/integration.test.mjs
      - name: Shutdown
        if: always()
        run: docker compose down -v
