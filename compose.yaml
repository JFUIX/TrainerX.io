services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trainerx
      POSTGRES_USER: trainerx
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainerx"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
