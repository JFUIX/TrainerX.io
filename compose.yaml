services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trainerx
      POSTGRES_USER: trainerx
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/004-member-profiles.sql:/docker-entrypoint-initdb.d/04-member-profiles.sql:ro
      - ./migrations/005-gym-operations.sql:/docker-entrypoint-initdb.d/05-gym-operations.sql:ro
      - ./migrations/006-membership-cancellation.sql:/docker-entrypoint-initdb.d/06-membership-cancellation.sql:ro
      - ./migrations/007-member-weight.sql:/docker-entrypoint-initdb.d/07-member-weight.sql:ro
      - ./migrations/008-member-freeze-history.sql:/docker-entrypoint-initdb.d/08-member-freeze-history.sql:ro
      - ./migrations/009-whatsapp-due-reminders.sql:/docker-entrypoint-initdb.d/09-whatsapp-due-reminders.sql:ro
      - ./migrations/010-reliability.sql:/docker-entrypoint-initdb.d/10-reliability.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trainerx"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_EXPIRY_TEMPLATE: ${WHATSAPP_EXPIRY_TEMPLATE:-}
      WHATSAPP_PERSONALIZED_FEE_DUE_TEMPLATE: ${WHATSAPP_PERSONALIZED_FEE_DUE_TEMPLATE:-}
      WHATSAPP_FEE_DUE_TEMPLATE: ${WHATSAPP_FEE_DUE_TEMPLATE:-}
      WHATSAPP_OVERDUE_TEMPLATE: ${WHATSAPP_OVERDUE_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
