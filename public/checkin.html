<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d5d7db"><script src="/theme.js"></script><link rel="stylesheet" href="/theme.css"><title>TrainerX | Gym Check-In</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--tx-text);padding:12px}.card{width:min(100%,400px);padding:20px;background:var(--tx-panel);border:1px solid var(--tx-card-line);border-radius:22px;box-shadow:0 16px 45px #24293620}h1{font-size:28px;margin:0 0 6px}p{color:var(--tx-muted);line-height:1.4;margin:6px 0}label{display:block;margin:12px 0 5px}input{display:block;width:100%;padding:9px;background:var(--tx-control);color:var(--tx-text);border:1px solid var(--tx-line);border-radius:12px;font-size:30px;text-align:center;letter-spacing:10px}button{margin-top:9px;width:100%;padding:10px;border:0;border-radius:999px;background:var(--tx-accent);color:var(--tx-accent-ink);font-size:17px;font-weight:800}button:disabled{opacity:.5}#message{margin:8px 0}#message:empty{display:none}form{margin-bottom:8px}small{color:var(--tx-muted)}</style></head>
<body><main class="card"><h1>Trainer<span style="color:var(--tx-accent-soft)">X</span> Check-In</h1><p>At the gym? Enter your assigned 4-digit attendance code. No account or app required.</p>
<form id="checkin"><label for="code">Attendance code</label><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" placeholder="0000" required><button id="submit">Mark Attendance</button></form>
<p id="message" role="status" aria-live="polite"></p><small>The entrance QR changes every minute. If it expires, scan the latest code again.</small></main>
<script>
const gate=new URLSearchParams(location.search).get('gate');
const message=document.querySelector('#message');
if(!gate){message.textContent='Missing entrance QR. Scan the code displayed at your gym.';document.querySelector('#submit').disabled=true}
document.querySelector('#checkin').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;message.textContent='Checking in…';
 try{const response=await fetch('/public-checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gate,code:document.querySelector('#code').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Check-in failed');message.textContent='✓ '+data.name+', attendance marked successfully!';document.querySelector('#checkin').reset()}
 catch(err){message.textContent=err.message}finally{button.disabled=false}
});
</script></body></html>
