<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101412"><title>TrainerX | Gym Operations</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf4ed;background:#0c100e}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}button.primary{background:#c3ff53;color:#18210e}button.secondary{background:#28332c;color:white}.shell{max-width:1120px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #273129;padding-bottom:20px}.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.logo span{color:#c3ff53}.sub{color:#a2b0a5;font-size:13px}.grid{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:24px}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left;background:transparent;color:#b9c7bb}nav button.active{background:#c3ff53;color:#11190f}main{min-width:0}.card{background:#171f1a;border:1px solid #2c382f;border-radius:16px;padding:22px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric strong{font-size:32px;display:block;color:#c3ff53}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form>*{min-width:0}label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#b4c1b6}input,select{width:100%;padding:12px;border-radius:10px;background:#0d130f;border:1px solid #3a483c;color:#fff}h1{font-size:30px;margin:8px 0}h2{font-size:19px}p{color:#b5c2b8}.item{padding:14px 0;border-bottom:1px solid #303d33;overflow-wrap:anywhere}.item:last-child{border:0}.badge{display:inline-block;padding:4px 9px;border-radius:8px;background:#30452a;color:#d3ff9b;font-size:12px}.error{color:#ff9f9f}.success{color:#c3ff53}#notice{min-height:24px}#login{max-width:430px;margin:10vh auto}.hidden{display:none!important}@media(max-width:720px){.grid{display:block}nav{flex-direction:row;overflow-x:auto;padding:12px 0}nav button{white-space:nowrap}.metrics{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.shell{padding:16px}}
</style></head><body>
<div class="shell"><header><div><div class="logo">TRAINER<span>X</span><small>.io</small></div><div class="sub">GYM OPERATIONS PLATFORM</div></div><div class="row"><span id="identity" class="sub"></span><button id="logout" class="secondary hidden">Log out</button></div></header>
<section id="login" class="card"><h1>Welcome back.</h1><p>Sign in to your gym workspace.</p><form id="loginForm" class="form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button></form></section>
<div id="workspace" class="grid hidden"><nav id="nav"></nav><main><div id="notice" role="status"></div><div id="content"></div></main></div></div>
<script>
let token=sessionStorage.getItem('tx-token')||'',me=null,view='';
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.error||'Request failed ('+r.status+')')}return r.status===204?null:r.json()}
function notice(msg,error=false){$('#notice').textContent=msg;$('#notice').className=error?'error':'success'}
function formData(form){return Object.fromEntries(new FormData(form))}
function form(fields,id,button){return '<form id="'+id+'" class="card form">'+fields.map(f=>'<label>'+f[1]+'<input name="'+f[0]+'" type="'+(f[2]||'text')+'" '+(f[3]||'required')+'></label>').join('')+'<button class="primary" type="submit">'+button+'</button></form>'}
function rows(data,fn){return data.length?data.map(fn).join(''):'<p>No records yet.</p>'}
const views={superadmin:['Gyms'],owner:['Overview','Members','Plans','Attendance','Renewals','Staff'],reception:['Members','Attendance','Renewals'],trainer:['Members'],member:['My attendance','My plans']};
function showShell(){const logged=!!me;$('#login').classList.toggle('hidden',logged);$('#workspace').classList.toggle('hidden',!logged);$('#logout').classList.toggle('hidden',!logged);$('#identity').textContent=logged?me.role+' · '+me.email:'';if(logged){view=views[me.role][0];render()}}
async function render(){notice('');$('#nav').innerHTML=views[me.role].map(v=>'<button class="'+(view===v?'active':'')+'" data-view="'+safe(v)+'">'+safe(v)+'</button>').join('');const el=$('#content');el.innerHTML='<p>Loading…</p>';try{
if(view==='Overview'){const x=await api('/report');el.innerHTML='<h1>Daily overview</h1><p>Live gym activity today</p><div class="metrics">'+[['Members',x.members],['Checked in today',x.attendance],['Renewals this week',x.renewals]].map(a=>'<div class="card metric"><span>'+a[0]+'</span><strong>'+a[1]+'</strong></div>').join('')+'</div>'}
if(view==='Gyms'){el.innerHTML='<h1>Create a gym</h1>'+form([['name','Gym name'],['currency','Currency (e.g. PKR)'],['email','Owner email','email'],['password','Owner password','password']],'gymForm','Create gym');bind('gymForm',async d=>api('/gyms','POST',{...d,currency:d.currency.toUpperCase()}))}
if(view==='Plans'){const p=await api('/plans');el.innerHTML='<h1>Membership plans</h1>'+form([['name','Plan name'],['months','Duration in months','number'],['price','Price','number']],'planForm','Add plan')+'<div class="card">'+rows(p,x=>'<div class="item">'+safe(x.name)+' · '+safe(x.months)+' months · '+safe(x.price)+'</div>')+'</div>';bind('planForm',async d=>api('/plans','POST',{...d,months:Number(d.months),price:Number(d.price)}))}
if(view==='Members'){const m=await api('/members');el.innerHTML='<h1>Members</h1>'+((me.role==='owner')?form([['email','Member email','email'],['password','Temporary password','password']],'memberForm','Create member'):'')+'<div class="card">'+rows(m,x=>'<div class="item"><b>'+safe(x.email)+'</b><p>'+safe(x.plan||'No membership')+' · '+safe(x.ends_on?String(x.ends_on).slice(0,10):'Not active')+'</p><small class="sub">ID: '+safe(x.id)+'</small></div>')+'</div>';if(me.role==='owner')bind('memberForm',async d=>api('/users','POST',{...d,role:'member'}))}
if(view==='Attendance'||view==='My attendance'){const a=await api('/attendance');el.innerHTML='<h1>Today’s attendance</h1>'+((me.role==='owner'||me.role==='reception')?form([['member_id','Member ID']],'checkinForm','Check in member'):'')+'<div class="card">'+rows(a,x=>'<div class="item">'+safe(x.email)+' <span class="badge">'+safe(new Date(x.checked_at).toLocaleTimeString())+'</span></div>')+'</div>';if($('#checkinForm'))bind('checkinForm',async d=>api('/attendance','POST',d))}
if(view==='Renewals'){const r=await api('/renewals');el.innerHTML='<h1>Upcoming renewals</h1><div class="card">'+rows(r,x=>'<div class="item"><b>'+safe(x.email)+'</b><p>'+safe(x.plan)+' · Expires '+safe(String(x.ends_on).slice(0,10))+'</p></div>')+'</div>'}
if(view==='Staff'){el.innerHTML='<h1>Add staff</h1>'+form([['email','Email','email'],['password','Password','password'],['role','Role (trainer or reception)']],'staffForm','Create staff');bind('staffForm',async d=>{if(!['trainer','reception'].includes(d.role))throw Error('Role must be trainer or reception');return api('/users','POST',d)})}
if(view==='My plans'){const p=await api('/plans');el.innerHTML='<h1>Available plans</h1><div class="card">'+rows(p,x=>'<div class="item"><b>'+safe(x.name)+'</b> · '+safe(x.months)+' months · '+safe(x.price)+'</div>')+'</div>'}
}catch(e){el.innerHTML='<p class="error">'+safe(e.message)+'</p>'}}
function bind(id,handler){$('#'+id).addEventListener('submit',async e=>{e.preventDefault();try{await handler(formData(e.target));notice('Saved successfully');await render();notice('Saved successfully')}catch(err){notice(err.message,true)}})}
$('#nav').onclick=e=>{const v=e.target.closest('[data-view]')?.dataset.view;if(v){view=v;render()}};
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await api('/login','POST',formData(e.target));token=r.token;sessionStorage.setItem('tx-token',token);me=await api('/me');showShell()}catch(err){alert(err.message)}};
$('#logout').onclick=async()=>{try{await api('/logout','POST')}catch{}token='';me=null;sessionStorage.removeItem('tx-token');showShell()};
(async()=>{if(token){try{me=await api('/me')}catch{token='';sessionStorage.removeItem('tx-token')}}showShell()})();
</script></body></html>
