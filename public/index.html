<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101412"><title>TrainerX | Gym Operations</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf4ed;background:#0c100e}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}button.primary{background:#c3ff53;color:#18210e}button.secondary{background:#28332c;color:white}.shell{max-width:1120px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #273129;padding-bottom:20px}.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.logo span{color:#c3ff53}.sub{color:#a2b0a5;font-size:13px}.grid{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:24px}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left;background:transparent;color:#b9c7bb}nav button.active{background:#c3ff53;color:#11190f}main{min-width:0}.card{background:#171f1a;border:1px solid #2c382f;border-radius:16px;padding:22px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric strong{font-size:32px;display:block;color:#c3ff53}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form>*{min-width:0}label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#b4c1b6}input,select{width:100%;padding:12px;border-radius:10px;background:#0d130f;border:1px solid #3a483c;color:#fff}h1{font-size:30px;margin:8px 0}h2{font-size:19px}p{color:#b5c2b8}.item{padding:14px 0;border-bottom:1px solid #303d33;overflow-wrap:anywhere}.item:last-child{border:0}.badge{display:inline-block;padding:4px 9px;border-radius:8px;background:#30452a;color:#d3ff9b;font-size:12px}.error{color:#ff9f9f}.success{color:#c3ff53}#notice{min-height:24px}#login{max-width:430px;margin:10vh auto}.hidden{display:none!important}@media(max-width:720px){.grid{display:block}nav{flex-direction:row;overflow-x:auto;padding:12px 0}nav button{white-space:nowrap}.metrics{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.shell{padding:16px}}
</style></head><body>
<div class="shell"><header><div><div class="logo">TRAINER<span>X</span><small>.io</small></div><div class="sub">GYM OPERATIONS PLATFORM</div></div><div class="row"><span id="identity" class="sub"></span><button id="logout" class="secondary hidden">Log out</button></div></header>
<section id="setup" class="card hidden" style="max-width:500px;margin:5vh auto"><h1>Set up TrainerX</h1><p>Create the first platform administrator. Enter the BOOTSTRAP_TOKEN from your Railway service variables, along with your administrator credentials.</p><form id="setupForm" class="form"><label>Admin email<input name="email" type="email" required autocomplete="email"></label><label>Admin password (12+ characters)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Setup token<input name="token" type="password" required autocomplete="off"></label><button class="primary" type="submit">Create administrator</button></form><p id="setupNotice" role="status"></p></section><section id="login" class="card"><h1>Welcome back.</h1><p>Sign in to your gym workspace.</p><form id="loginForm" class="form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button></form></section>
<div id="workspace" class="grid hidden"><nav id="nav"></nav><main><div id="notice" role="status"></div><div id="content"></div></main></div></div>
<script>
let gateTimer=null,scannerStream=null;let token=sessionStorage.getItem('tx-token')||'',me=null,view='';
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.error||'Request failed ('+r.status+')')}if(r.status===204)return null;const raw=await r.text();if(!raw)return null;try{return JSON.parse(raw)}catch{return {message:raw}}}
function notice(msg,error=false){$('#notice').textContent=msg;$('#notice').className=error?'error':'success'}
function formData(form){return Object.fromEntries(new FormData(form))}
function form(fields,id,button){return '<form id="'+id+'" class="card form">'+fields.map(f=>'<label>'+f[1]+'<input name="'+f[0]+'" type="'+(f[2]||'text')+'" '+(f[3]||'required')+'></label>').join('')+'<button class="primary" type="submit">'+button+'</button></form>'}
function rows(data,fn){return data.length?data.map(fn).join(''):'<p>No records yet.</p>'}
const views={superadmin:['Gyms'],owner:['Overview','Members','Plans','Memberships','Fees','Attendance','Gate QR','Workouts','Diets','Renewals','Staff'],reception:['Members','Memberships','Fees','Attendance','Gate QR','Renewals'],trainer:['Members','Workouts','Diets'],member:['My attendance','Scan QR','My plans','Workouts','Diets']};
function showShell(){const logged=!!me;$('#setup').classList.add('hidden');$('#login').classList.toggle('hidden',logged);$('#workspace').classList.toggle('hidden',!logged);$('#logout').classList.toggle('hidden',!logged);$('#identity').textContent=logged?me.role+' · '+me.email:'';if(logged){view=views[me.role][0];render()}}
async function render(){if(gateTimer){clearInterval(gateTimer);gateTimer=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}notice('');$('#nav').innerHTML=views[me.role].map(v=>'<button class="'+(view===v?'active':'')+'" data-view="'+safe(v)+'">'+safe(v)+'</button>').join('');const el=$('#content');el.innerHTML='<p>Loading…</p>';try{
if(view==='Overview'){const x=await api('/report');el.innerHTML='<h1>Daily overview</h1><p>Live gym activity today</p><div class="metrics">'+[['Members',x.members],['Checked in today',x.attendance],['Renewals this week',x.renewals]].map(a=>'<div class="card metric"><span>'+a[0]+'</span><strong>'+a[1]+'</strong></div>').join('')+'</div>'}
if(view==='Gyms'){el.innerHTML='<h1>Create a gym</h1>'+form([['name','Gym name'],['currency','Currency (e.g. PKR)'],['email','Owner email','email'],['password','Owner password','password']],'gymForm','Create gym');bind('gymForm',async d=>api('/gyms','POST',{...d,currency:d.currency.toUpperCase()}))}
if(view==='Plans'){const p=await api('/plans');el.innerHTML='<h1>Membership plans</h1>'+form([['name','Plan name'],['months','Duration in months','number'],['price','Price','number']],'planForm','Add plan')+'<div class="card">'+rows(p,x=>'<div class="item">'+safe(x.name)+' · '+safe(x.months)+' months · '+safe(x.price)+'</div>')+'</div>';bind('planForm',async d=>api('/plans','POST',{...d,months:Number(d.months),price:Number(d.price)}))}
if(view==='Members'){const m=await api('/members');el.innerHTML='<h1>Members</h1>'+((me.role==='owner')?form([['email','Member email','email'],['password','Temporary password','password']],'memberForm','Create member'):'')+'<div class="card">'+rows(m,x=>'<div class="item"><b>'+safe(x.email)+'</b><p>'+safe(x.plan||'No membership')+' · '+safe(x.ends_on?String(x.ends_on).slice(0,10):'Not active')+'</p><small class="sub">ID: '+safe(x.id)+'</small></div>')+'</div>';if(me.role==='owner')bind('memberForm',async d=>api('/users','POST',{...d,role:'member'}))}
if(view==='Attendance'||view==='My attendance'){const a=await api('/attendance');el.innerHTML='<h1>Today’s attendance</h1>'+((me.role==='owner'||me.role==='reception')?form([['member_id','Member ID']],'checkinForm','Check in member'):'')+'<div class="card">'+rows(a,x=>'<div class="item">'+safe(x.email)+' <span class="badge">'+safe(new Date(x.checked_at).toLocaleTimeString())+'</span></div>')+'</div>';if($('#checkinForm'))bind('checkinForm',async d=>api('/attendance','POST',d))}

if(view==='Memberships'){const [m,p]=await Promise.all([api('/members'),api('/plans')]);const opts=(items,label)=>items.map(x=>'<option value="'+safe(x.id)+'">'+safe(label(x))+'</option>').join('');el.innerHTML='<h1>Memberships & renewals</h1><form id="membershipForm" class="card form"><label>Member<select name="member_id" required>'+opts(m,x=>x.email)+'</select></label><label>Plan<select name="plan_id" required>'+opts(p,x=>x.name+' · '+x.price)+'</select></label><label>Start date<input name="starts_on" type="date" required></label><button class="primary" type="submit">Assign membership</button></form>';const a=await api('/memberships');el.innerHTML+='<div class="card">'+rows(a,x=>'<div class="item"><b>'+safe(x.email)+'</b> · '+safe(x.plan)+'<p>'+safe(String(x.starts_on).slice(0,10))+' to '+safe(String(x.ends_on).slice(0,10))+' · Paid '+safe(x.paid)+' / '+safe(x.price)+'</p><small class="sub">Membership ID: '+safe(x.id)+'</small></div>')+'</div>';bind('membershipForm',async d=>api('/memberships','POST',d))}
if(view==='Fees'){const [m,fees]=await Promise.all([api('/memberships'),api('/fees')]);el.innerHTML='<h1>Fee collection</h1><p>Record payments actually received. This does not charge a card or verify a bank transfer.</p><form id="feeForm" class="card form"><label>Membership<select name="membership_id" required>'+m.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.email)+' · '+safe(x.plan)+' · Due '+safe((Number(x.price)-Number(x.paid)).toFixed(2))+'</option>').join('')+'</select></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Method<select name="method"><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="upi">UPI</option><option value="other">Other</option></select></label><label>Reference (optional)<input name="reference" maxlength="120"></label><button class="primary" type="submit">Record payment</button></form><div class="card"><h2>Recent payments</h2>'+rows(fees,x=>'<div class="item"><b>'+safe(x.email)+'</b> · '+safe(x.amount)+' · '+safe(x.method)+'<p>'+safe(new Date(x.paid_at).toLocaleString())+' · Receipt ID '+safe(x.id)+'</p><button class="secondary" data-receipt="'+safe(x.id)+'">Print receipt</button></div>')+'</div>';bind('feeForm',async d=>api('/fees','POST',{...d,amount:Number(d.amount)}))}

if(view==='Gate QR'){el.innerHTML='<h1>Gym entrance QR</h1><p>Members scan this rotating code using their own signed-in account. It refreshes every 30 seconds.</p><div class="card"><img id="gateImage" width="280" height="280" alt="Gym entrance QR code"><p id="gateExpiry"></p></div>';const refresh=async()=>{try{const x=await api('/gate-qr');if(view==='Gate QR'){$('#gateImage').src=x.qr;$('#gateExpiry').textContent='Expires: '+new Date(x.expires_at).toLocaleTimeString()}}catch(e){notice(e.message,true)}};await refresh();gateTimer=setInterval(refresh,30000)}
if(view==='Scan QR'){el.innerHTML='<h1>Scan entrance QR</h1><p>Camera scanning requires HTTPS (or localhost) and a browser supporting BarcodeDetector. Alternatively, paste the QR content.</p><div class="card"><video id="scanVideo" autoplay playsinline muted style="width:100%;max-width:420px"></video><div class="row"><button class="primary" id="startScan">Start camera</button><button class="secondary" id="stopScan">Stop camera</button></div></div>'+form([['code','QR content']],'scanForm','Check in');bind('scanForm',async d=>api('/gate-checkin','POST',d));$('#stopScan').onclick=()=>{if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}};$('#startScan').onclick=async()=>{if(!('BarcodeDetector' in window)){notice('Camera QR detection unavailable in this browser. Use QR content input.',true);return}try{scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const video=$('#scanVideo');video.srcObject=scannerStream;await video.play();const detector=new BarcodeDetector({formats:['qr_code']});const scan=async()=>{if(!scannerStream||view!=='Scan QR')return;try{const codes=await detector.detect(video);if(codes.length){$('#scanForm [name=code]').value=codes[0].rawValue;scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;$('#scanForm').requestSubmit();return}}catch{}setTimeout(scan,300)};scan()}catch(e){notice(e.message,true)}}}
if(view==='Workouts'||view==='Diets'){const workout=view==='Workouts',key=workout?'exercises':'meals',endpoint=workout?'/workouts':'/diets';const plans=await api(endpoint);let members=[];if(me.role!=='member')members=await api('/members');el.innerHTML='<h1>'+view+'</h1><p>'+ (workout?'Exercise plans with sets and reps':'Meal plans and nutrition guidance')+'</p>'+(me.role==='member'?'':'<form id="trainingForm" class="card form"><label>Member<select name="member_id">'+members.map(m=>'<option value="'+safe(m.id)+'">'+safe(m.email)+'</option>').join('')+'</select></label><label>Plan title<input name="title" required maxlength="120"></label><label style="grid-column:1/-1">'+(workout?'Exercises: one per line (Name | Sets | Reps)':'Meals: one per line (Meal | Food | Calories)')+'<textarea name="lines" required rows="6" style="width:100%;background:#0d130f;color:white;padding:12px;border:1px solid #3a483c;border-radius:10px"></textarea></label><button class="primary">Save plan</button></form>')+'<div class="card">'+rows(plans,p=>'<div class="item"><b>'+safe(p.title)+'</b><p>'+safe(p.member)+'</p>'+p[key].map(x=>'<div class="sub">'+Object.values(x).map(safe).join(' · ')+'</div>').join('')+'</div>')+'</div>';if($('#trainingForm'))bind('trainingForm',async d=>{const lines=d.lines.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length||lines.length>30)throw Error('Enter 1–30 lines');const items=lines.map(line=>{const parts=line.split('|').map(x=>x.trim());return workout?{name:parts[0]||'',sets:parts[1]||'',reps:parts[2]||''}:{meal:parts[0]||'',food:parts[1]||'',calories:parts[2]||''}});return api(endpoint,'POST',{member_id:d.member_id,title:d.title,[key]:items})})}
if(view==='Renewals'){const r=await api('/renewals');el.innerHTML='<h1>Upcoming renewals</h1><div class="card">'+rows(r,x=>'<div class="item"><b>'+safe(x.email)+'</b><p>'+safe(x.plan)+' · Expires '+safe(String(x.ends_on).slice(0,10))+'</p></div>')+'</div>'}
if(view==='Staff'){el.innerHTML='<h1>Add staff</h1>'+form([['email','Email','email'],['password','Password','password'],['role','Role (trainer or reception)']],'staffForm','Create staff');bind('staffForm',async d=>{if(!['trainer','reception'].includes(d.role))throw Error('Role must be trainer or reception');return api('/users','POST',d)})}
if(view==='My plans'){const p=await api('/plans');el.innerHTML='<h1>Available plans</h1><div class="card">'+rows(p,x=>'<div class="item"><b>'+safe(x.name)+'</b> · '+safe(x.months)+' months · '+safe(x.price)+'</div>')+'</div>'}
}catch(e){el.innerHTML='<p class="error">'+safe(e.message)+'</p>'}}
function bind(id,handler){$('#'+id).addEventListener('submit',async e=>{e.preventDefault();try{await handler(formData(e.target));notice('Saved successfully');await render();notice('Saved successfully')}catch(err){notice(err.message,true)}})}
$('#content').addEventListener('click',async e=>{const id=e.target.closest('[data-receipt]')?.dataset.receipt;if(!id)return;try{const x=await api('/fees/'+id+'/receipt');const w=window.open('','_blank');if(!w){notice('Allow pop-ups to print receipts',true);return}const fields=[['Gym',x.gym],['Receipt ID',x.id],['Member',x.member],['Plan',x.plan],['Amount',x.currency+' '+x.amount],['Method',x.method],['Reference',x.reference||'—'],['Paid at',new Date(x.paid_at).toLocaleString()]];w.document.write('<!doctype html><html><head><title>TrainerX Receipt</title><meta charset="utf-8"><style>body{font:16px system-ui;max-width:540px;margin:60px auto;padding:20px}h1{border-bottom:2px solid #222;padding-bottom:16px}p{padding:8px;border-bottom:1px solid #ddd}</style></head><body><h1>Payment Receipt</h1>'+fields.map(([k,v])=>'<p><b>'+safe(k)+':</b> '+safe(v)+'</p>').join('')+'<p>Payment recorded by gym staff. Not proof of bank settlement.</p></body></html>');w.document.close();w.focus();w.print()}catch(err){notice(err.message,true)}});
$('#nav').onclick=e=>{const v=e.target.closest('[data-view]')?.dataset.view;if(v){view=v;render()}};
$('#setupForm').onsubmit=async e=>{e.preventDefault();try{await api('/bootstrap','POST',formData(e.target));$('#setup').classList.add('hidden');$('#login').classList.remove('hidden');$('#setupNotice').textContent='';alert('Administrator created. Sign in using your new credentials.')}catch(err){$('#setupNotice').textContent=err.message;$('#setupNotice').className='error'}};
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await api('/login','POST',formData(e.target));token=r.token;sessionStorage.setItem('tx-token',token);me=await api('/me');showShell()}catch(err){alert(err.message)}};
$('#logout').onclick=async()=>{try{await api('/logout','POST')}catch{}token='';me=null;sessionStorage.removeItem('tx-token');showShell()};
(async()=>{if(token){try{me=await api('/me')}catch{token='';sessionStorage.removeItem('tx-token')}}showShell();if(!me){try{const status=await api('/setup-status');if(status.setupRequired){$('#login').classList.add('hidden');$('#setup').classList.remove('hidden')}}catch{}}})();
</script></body></html>
