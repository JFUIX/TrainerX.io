<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101412"><title>TrainerX | Gym Operations</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf4ed;background:#0c100e}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}button.primary{background:#c3ff53;color:#18210e}button.secondary{background:#28332c;color:white}.shell{max-width:1120px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #273129;padding-bottom:20px}.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.logo span{color:#c3ff53}.sub{color:#a2b0a5;font-size:13px}.grid{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:24px}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left;background:transparent;color:#b9c7bb}nav button.active{background:#c3ff53;color:#11190f}main{min-width:0}.card{background:#171f1a;border:1px solid #2c382f;border-radius:16px;padding:22px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric strong{font-size:32px;display:block;color:#c3ff53}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form>*{min-width:0}label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#b4c1b6}input,select{width:100%;padding:12px;border-radius:10px;background:#0d130f;border:1px solid #3a483c;color:#fff}h1{font-size:30px;margin:8px 0}h2{font-size:19px}p{color:#b5c2b8}.item{padding:14px 0;border-bottom:1px solid #303d33;overflow-wrap:anywhere}.item:last-child{border:0}.badge{display:inline-block;padding:4px 9px;border-radius:8px;background:#30452a;color:#d3ff9b;font-size:12px}.error{color:#ff9f9f}.success{color:#c3ff53}#notice{min-height:24px}#login{max-width:430px;margin:10vh auto}.hidden{display:none!important}@media(max-width:720px){.grid{display:block}nav{flex-direction:row;overflow-x:auto;padding:12px 0}nav button{white-space:nowrap}.metrics{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.shell{padding:16px}}

.dashboard-hero{padding:25px;border-radius:20px;background:radial-gradient(circle at 92% 12%,#334d22 0,transparent 46%),linear-gradient(130deg,#1d2b20,#121a15);border:1px solid #3d5239;margin:12px 0 18px}.dashboard-hero h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1.2px}.dashboard-hero p{margin:7px 0 0}.dash-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.dash-kpi{margin:0;min-height:125px;background:linear-gradient(145deg,#1d2920,#141c17);position:relative;overflow:hidden}.dash-kpi:before{content:'';position:absolute;right:-28px;top:-36px;width:105px;height:105px;border-radius:50%;background:#c3ff530d}.dash-kpi .kpi-label{font-size:12px;color:#a9b8aa;font-weight:600}.dash-kpi strong{font-size:clamp(22px,3vw,32px);display:block;margin:14px 0 3px;letter-spacing:-1px;color:#effbea}.dash-kpi.accent strong{color:#c3ff53}.dash-kpi small{font-size:11px;color:#7f9484}.dash-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.dash-panels .card{margin:0}.dash-panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.dash-panel-head h2{margin:0}.dash-chart{height:154px;display:flex;align-items:end;gap:10px;padding-top:18px}.dash-chart .bar-col{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;justify-content:end;height:100%;gap:6px}.dash-chart .bar{width:100%;border-radius:6px 6px 2px 2px;min-height:3px;background:linear-gradient(0deg,#6da52e,#c3ff53)}.dash-chart .bar-col span{font-size:10px;color:#9daea0}.dash-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.dash-action{background:#222f24;border:1px solid #3b4d3b;color:#e9f6e9;text-align:left;font-size:12px;padding:14px}.dash-action strong{display:block;color:#c3ff53;font-size:22px;margin-bottom:3px}.dash-action:hover{border-color:#c3ff53}.dash-feed{display:flex;justify-content:space-between;gap:10px;font-size:13px}.dash-feed time{color:#93a595;white-space:nowrap}@media(max-width:850px){.dash-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-panels{grid-template-columns:1fr}}@media(max-width:450px){.dash-kpi{padding:15px;min-height:112px}.dash-chart{gap:6px}.dashboard-hero{padding:20px}}
 .money-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.money-line strong{margin:0}.money-toggle{background:#293a2c;color:#c3ff53;border:1px solid #486144;padding:6px 9px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}.money-toggle:hover{background:#354b37}.money-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.money-value{font-variant-numeric:tabular-nums} 
.member-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.member-toolbar input{flex:1;min-width:180px}.member-toolbar select{width:auto;min-width:130px}.member-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.member-mini .card{margin:0;padding:15px}.member-mini strong{font-size:25px;display:block;color:#c3ff53}.member-list .item{display:flex;justify-content:space-between;align-items:center;gap:12px}.member-person{display:flex;align-items:center;gap:12px;min-width:0}.member-avatar{flex-shrink:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#30472e;color:#d4ffac;font-weight:800}.member-person p{margin:5px 0;font-size:12px}.member-status{font-size:11px;padding:5px 9px;border-radius:30px;background:#2c3c2c;color:#c9ff8b}.member-status.expired{background:#4a2929;color:#ffadad}.member-status.inactive{background:#3c3c3c;color:#bbb}.member-actions{display:flex;gap:7px;align-items:center}.member-actions button{padding:8px 11px;font-size:12px}.member-detail{margin-top:15px;border-color:#668d47}.member-tabs{display:flex;gap:6px;overflow:auto;margin:15px 0}.member-tabs button{white-space:nowrap;padding:9px 12px;font-size:12px;background:#263328;color:#dce7db}.member-tabs button.active{background:#c3ff53;color:#18210e}.member-data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.member-data div{background:#111a14;border-radius:10px;padding:12px;overflow-wrap:anywhere}.member-data small{display:block;color:#8fa293;margin-bottom:6px}.member-form-wrap{display:none}.member-form-wrap.open{display:block}@media(max-width:550px){.member-mini{grid-template-columns:repeat(3,1fr)}.member-mini .card{padding:11px}.member-mini strong{font-size:20px}.member-list .item{align-items:flex-start;flex-direction:column}.member-data{grid-template-columns:1fr}.member-toolbar select{flex:1}}
</style></head><body>
<div class="shell"><header><div><div class="logo">TRAINER<span>X</span><small>.io</small></div><div class="sub">GYM OPERATIONS PLATFORM</div></div><div class="row"><span id="identity" class="sub"></span><button id="logout" class="secondary hidden">Log out</button></div></header>
<section id="setup" class="card hidden" style="max-width:500px;margin:5vh auto"><h1>Set up TrainerX</h1><p>Create the first platform administrator. Enter the BOOTSTRAP_TOKEN from your Railway service variables, along with your administrator credentials.</p><form id="setupForm" class="form"><label>Admin email<input name="email" type="email" required autocomplete="email"></label><label>Admin password (12+ characters)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Setup token<input name="token" type="password" required autocomplete="off"></label><button class="primary" type="submit">Create administrator</button></form><p id="setupNotice" role="status"></p></section><section id="login" class="card"><div class="sub" style="letter-spacing:.08em;color:#c3ff53">TRAINERX ACCESS PORTAL</div><h1 id="portalTitle">Sign in</h1><p id="portalDescription">Gym owner sign in</p><form id="loginForm" class="form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button><p id="loginNotice" role="status" style="grid-column:1/-1"></p></form><div style="margin-top:24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px"><a id="adminAccess" href="/admin" style="font-size:13px;color:#b9c7bb;text-decoration:underline;text-underline-offset:4px">Super Admin sign in</a><a id="backToGym" href="/gym" class="hidden" style="font-size:13px;color:#b9c7bb;text-decoration:underline;text-underline-offset:4px">Back to gym owner sign in</a><button id="recoverToggle" type="button" style="font-size:12px;font-weight:400;background:transparent;color:#94a69a;padding:0;text-decoration:underline;text-underline-offset:3px" class="hidden">Forgot Super Admin password?</button></div><form id="recoverForm" class="form hidden" style="margin-top:18px"><label>Super Admin email<input name="email" type="email" required></label><label>New password (12+ characters)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Railway BOOTSTRAP_TOKEN<input name="token" type="password" required autocomplete="off"></label><button class="primary" type="submit">Reset Super Admin password</button></form><p id="recoverNotice" role="status"></p></section>
<div id="workspace" class="grid hidden"><nav id="nav"></nav><main><div id="notice" role="status"></div><div id="content"></div></main></div></div>
<script>
let gateTimer=null,scannerStream=null;let token=sessionStorage.getItem('tx-token')||'',me=null,view='';
const portal=location.pathname==='/admin'?'admin':'gym';
const adminPortal=portal==='admin';
document.querySelector('#portalTitle').textContent=adminPortal?'Super Admin sign in':'Sign in';
document.querySelector('#portalDescription').textContent=adminPortal?'Platform administrator access':'Gym owner sign in';
document.querySelector('#adminAccess').classList.toggle('hidden',adminPortal);
document.querySelector('#backToGym').classList.toggle('hidden',!adminPortal);
document.querySelector('#recoverToggle').classList.toggle('hidden',!adminPortal);
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.error||'Request failed ('+r.status+')')}if(r.status===204)return null;const raw=await r.text();if(!raw)return null;try{return JSON.parse(raw)}catch{return {message:raw}}}
function notice(msg,error=false){$('#notice').textContent=msg;$('#notice').className=error?'error':'success'}
function formData(form){return Object.fromEntries(new FormData(form))}
function form(fields,id,button){return '<form id="'+id+'" class="card form">'+fields.map(f=>'<label>'+f[1]+'<input name="'+f[0]+'" type="'+(f[2]||'text')+'" '+(f[3]||'required')+'></label>').join('')+'<button class="primary" type="submit">'+button+'</button></form>'}
function rows(data,fn){return data.length?data.map(fn).join(''):'<p>No records yet.</p>'}
const views={superadmin:['Gyms'],owner:['Overview','Members','Plans','Fees','Attendance','Gate QR','Workouts','Diets','Renewals','Staff'],reception:['Members','Fees','Attendance','Gate QR','Renewals'],trainer:['Members','Workouts','Diets'],member:['My attendance','Scan QR','My plans','Workouts','Diets']};
function showShell(){const logged=!!me;$('#setup').classList.add('hidden');$('#login').classList.toggle('hidden',logged);$('#workspace').classList.toggle('hidden',!logged);$('#logout').classList.toggle('hidden',!logged);$('#identity').textContent=logged?me.role+' · '+me.email:'';if(logged){view=views[me.role][0];render()}}
async function render(){if(gateTimer){clearInterval(gateTimer);gateTimer=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}notice('');$('#nav').innerHTML=views[me.role].map(v=>'<button class="'+(view===v?'active':'')+'" data-view="'+safe(v)+'">'+safe(v)+'</button>').join('');const el=$('#content');el.innerHTML='<p>Loading…</p>';try{
if(view==='Gyms'){const gyms=await api('/gyms');el.innerHTML='<h1>Gym management</h1><p>Manage gym accounts and reset owner passwords securely.</p><div class="card">'+rows(gyms,g=>'<div class="item"><strong>'+safe(g.name)+'</strong><p>'+safe(g.owner_email||'No owner')+' · '+safe(g.currency)+'</p><form class="row" data-reset-gym="'+safe(g.id)+'"><label style="flex:1;min-width:210px">New owner password<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" placeholder="12+ characters" required></label><button class="secondary" type="submit">Reset owner password</button></form></div>')+'</div><h2>Add gym</h2>'+form([['name','Gym name'],['currency','Currency (e.g. PKR)'],['email','Owner email','email'],['password','Owner password (12+ characters)','password']],'gymForm','Create gym');bind('gymForm',async d=>{await api('/gyms','POST',d)});el.querySelectorAll('[data-reset-gym]').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const gym=gyms.find(g=>g.id===form.dataset.resetGym);if(!confirm('Reset the owner password for '+gym.name+'? Existing owner sessions will be signed out.'))return;try{await api('/gyms/'+encodeURIComponent(gym.id)+'/reset-owner-password','POST',{password:form.elements.password.value});form.reset();notice('Owner password reset. Sign in with the new password.')}catch(err){notice(err.message,true)}}))}
if(view==='Overview'){const x=await api('/report');const money=v=>'PKR '+Number(v||0).toLocaleString('en-PK',{maximumFractionDigits:0});const eyeIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';const moneyToggle=(key,value)=>'<button type="button" class="money-toggle" data-money-toggle="'+key+'" aria-label="Show amount" aria-pressed="false" title="Show amount">'+eyeIcon+'</button>';const cards=[['Total Members',x.members,'All registered'],['Active Members',x.active,'Valid memberships'],['Today’s Check-ins',x.attendance,'Gym visits'],['Collected Today',money(x.revenue_today),'Recorded payments'],['Pending Fees',money(x.pending),'Outstanding balances'],['New Members',x.new_members,'Joined today']];const maxRev=Math.max(1,...x.trend.map(d=>Number(d.revenue)));const maxAtt=Math.max(1,...x.trend.map(d=>Number(d.attendance)));const chart=(field,max,format)=>'<div class="dash-chart">'+x.trend.map(d=>'<div class="bar-col" title="'+safe(format(d[field]))+'"><div class="bar" style="height:'+Math.max(3,Math.round(Number(d[field])/max*100))+'%"></div><span>'+safe(d.label)+'</span></div>').join('')+'</div>';el.innerHTML='<section class="dashboard-hero"><span class="badge">● LIVE OPERATIONS</span><h1>Good to see you.</h1><p>Here’s what’s happening at your gym today · '+safe(new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}))+'</p></section><div class="dash-kpis">'+cards.map((a,i)=>'<div class="card dash-kpi '+(i===3?'accent':'')+'"><span class="kpi-label">'+safe(a[0])+'</span><div class="money-line"><strong '+(i===3?'class="money-value" data-money="today" data-amount="'+safe(a[1])+'"':'')+'>'+safe(i===3?'••••••':a[1])+'</strong>'+(i===3?moneyToggle('today'):'')+'</div><small>'+safe(a[2])+'</small></div>').join('')+'</div><div class="dash-panels"><section class="card"><div class="dash-panel-head"><h2>Revenue</h2><span class="badge">7 days</span></div><p class="money-line">This month: <b class="money-value" data-money="revenue" data-amount="'+safe(money(x.revenue_month))+'">••••••</b>'+moneyToggle('revenue')+'</p>'+chart('revenue',maxRev,money)+'</section><section class="card"><div class="dash-panel-head"><h2>Attendance</h2><span class="badge">7 days</span></div><p>Today’s attendance rate: <b>'+safe(x.active?Math.round(x.attendance/x.active*100):0)+'%</b></p>'+chart('attendance',maxAtt,v=>v+' visits')+'</section><section class="card"><div class="dash-panel-head"><h2>Needs attention</h2><span class="badge">Action center</span></div><div class="dash-actions"><button class="dash-action" data-jump="Renewals"><strong>'+safe(x.renewals)+'</strong>Expiring in 7 days</button><button class="dash-action" data-jump="Members"><strong>'+safe(x.expired)+'</strong>Expired memberships</button><button class="dash-action" data-jump="Members"><strong>'+safe(x.new_members)+'</strong>New members today</button></div></section></div>';el.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{view=b.dataset.jump;render()})}
if(view==='Plans'){const p=await api('/plans');el.innerHTML='<h1>Membership plans</h1><p>Create and manage the plans offered to your members.</p>'+form([['name','Plan name'],['months','Duration (months)','number','min="1" max="120" required'],['price','Fee (PKR)','number','min="0" step="0.01" required']],'planForm','Create plan')+'<div class="card"><h2>Available plans</h2>'+rows(p,x=>'<div class="item"><strong>'+safe(x.name)+'</strong><p>'+safe(x.months)+' months · PKR '+safe(x.price)+'</p></div>')+'</div>';bind('planForm',async d=>api('/plans','POST',{...d,months:Number(d.months),price:Number(d.price)}))}
if(view==='Members'){const m=await api('/members');const canCreate=['owner','reception'].includes(me.role);const trainers=canCreate?await api('/trainers'):[];const enrollmentPlans=canCreate?await api('/plans'):[];const today=new Date().toISOString().slice(0,10);const status=x=>!x.active?'Inactive':!x.ends_on?'No Plan':String(x.starts_on).slice(0,10)>today?'Upcoming':String(x.ends_on).slice(0,10)<today?'Expired':'Active';const initials=x=>(x.full_name||x.email||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();const active=m.filter(x=>status(x)==='Active').length,expired=m.filter(x=>status(x)==='Expired').length;el.innerHTML='<div class="row" style="justify-content:space-between"><div><h1>Members</h1><p>Your complete member directory.</p></div>'+(canCreate?'<button id="addMember" class="primary">+ Add Member</button>':'')+'</div><div class="member-mini"><div class="card"><span class="sub">Total</span><strong>'+m.length+'</strong></div><div class="card"><span class="sub">Active</span><strong>'+active+'</strong></div><div class="card"><span class="sub">Expired</span><strong>'+expired+'</strong></div></div>'+(canCreate?'<div class="member-form-wrap" id="enrollWrap"><form id="memberForm" class="card form"><label>Member ID<input value="Automatically generated" disabled></label><label>Join Date<input name="joined_on" type="date" required></label><label>Full Name<input name="full_name" maxlength="150" required></label><label>Phone<input name="phone" type="tel" maxlength="40" required></label><label>Age<input name="age" type="number" min="1" max="120" required></label><label>Email<input name="email" type="email" required></label><label>Address<input name="residential_address" maxlength="500" required></label><label>Plan<select name="plan_id" required><option value="">Select plan</option>'+enrollmentPlans.map(p=>'<option value="'+safe(p.id)+'">'+safe(p.name)+' · '+safe(p.months)+' mo · '+safe(p.price)+' PKR</option>').join('')+'</select></label><label>Fee (PKR)<input name="amount" type="number" readonly required></label><label>Duration (months)<input name="membership_months" type="number" readonly required></label><label>Trainer<select name="trainer_id"><option value="">Unassigned / General Training</option>'+trainers.map(t=>'<option value="'+safe(t.id)+'">'+safe(t.email)+'</option>').join('')+'</select></label><label>Password<input name="password" type="password" minlength="12" required></label><button class="primary" type="submit" >Enroll Member</button></form></div>':'')+'<div class="member-toolbar"><input id="memberSearch" placeholder="Search name, ID, phone or email"><select id="memberFilter"><option value="All">All statuses</option><option>Active</option><option>Expired</option><option>Inactive</option><option>Upcoming</option><option>No Plan</option></select><button class="secondary" id="exportMembers">Export CSV</button></div><div class="card member-list" id="memberList"></div><div id="memberDetail"></div>';const list=()=>{const q=$('#memberSearch').value.toLowerCase().trim(),filter=$('#memberFilter').value;const shown=m.filter(x=>(filter==='All'||status(x)===filter)&&[x.full_name,x.email,x.phone,x.membership_no].some(v=>String(v||'').toLowerCase().includes(q)));$('#memberList').innerHTML=rows(shown,x=>'<div class="item"><div class="member-person"><div class="member-avatar">'+safe(initials(x))+'</div><div><b>'+safe(x.full_name||x.email)+'</b><p>#'+safe(x.membership_no||'—')+' · '+safe(x.plan||'No plan')+' · '+safe(x.phone||'No phone')+'</p></div></div><div class="member-actions"><span class="member-status '+(status(x)==='Expired'?'expired':status(x)==='Inactive'?'inactive':'')+'">'+status(x)+'</span><button class="secondary" data-member="'+safe(x.id)+'">View</button></div></div>');$('#memberList').querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>showMember(m.find(x=>x.id===b.dataset.member)))};const showMember=async x=>{if(!x)return;const h=await api('/members/'+encodeURIComponent(x.id)+'/hist
